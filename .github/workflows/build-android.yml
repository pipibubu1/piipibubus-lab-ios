name: Build Android app
on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/build-android.yml'
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile APK
        run: |
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
          gradle -p android assembleRelease --no-daemon
          mkdir -p android-output
          cp android/app/build/outputs/apk/release/*.apk android-output/build.apk
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" android-output/
      - uses: actions/upload-artifact@v7
        with:
          name: PIIPIBUBUS-LAB-Android-build
          path: android-output/
          if-no-files-found: error
          retention-days: 7
